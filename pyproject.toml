[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otascrape"
version = "0.1.0"
description = "Otel fiyatlarını OTA/metasearch kanallarında düzenli tarar, kaydeder ve kanallar arası farkları raporlar."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
otascrape = "otascrape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
